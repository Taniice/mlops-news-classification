name: MLOps Scheduled Maintenance

on:
  schedule:
    # Domingo a la 01:00 AM hora de Perú (UTC-5)
    # GitHub Actions utiliza UTC → 06:00 UTC
    - cron: "0 6 * * 0"

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1: Data & Model Maintenance
  # ─────────────────────────────────────────────────────────────
  maintenance:
    name: 🔄 Weekly Model Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            scikit-learn \
            numpy \
            pandas \
            mlflow \
            joblib \
            pyyaml \
            matplotlib \
            seaborn \
            evidently \
            datasets

      # ---------------------------------------------------------
      # Actualizar datos
      # ---------------------------------------------------------
      - name: Ingest latest data
        run: |
          python src/ingest.py

      # ---------------------------------------------------------
      # Preprocesar datos
      # ---------------------------------------------------------
      - name: Preprocess data
        run: |
          python src/preprocess.py

      # ---------------------------------------------------------
      # Detectar drift
      # ---------------------------------------------------------
      - name: Run drift monitoring
        id: monitoring
        run: |
          python -X utf8 monitoring/monitor.py
        continue-on-error: true
        env:
          PYTHONUTF8: "1"

      # ---------------------------------------------------------
      # Guardar reportes
      # ---------------------------------------------------------
      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-maintenance-${{ github.run_number }}
          path: |
            reports/
          retention-days: 30

      # ---------------------------------------------------------
      # Resumen
      # ---------------------------------------------------------
      - name: Write maintenance summary
        if: always()
        run: |
          echo "## 🔄 Weekly MLOps Maintenance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Schedule:* Every Sunday at 01:00 AM (Peru)" >> $GITHUB_STEP_SUMMARY
          echo "*Monitoring status:* ${{ steps.monitoring.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "*Run:* #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tasks executed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Data ingestion" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Data preprocessing" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Data drift monitoring" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Monitoring report generated" >> $GITHUB_STEP_SUMMARY