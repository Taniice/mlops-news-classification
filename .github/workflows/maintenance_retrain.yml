name: Pipeline de Mantenimiento — Reentrenamiento y Despliegue Automático

on:
  schedule:
    # Ejecución programada semanal: todos los domingos a las 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Forzar reentrenamiento independientemente de drift"
        required: false
        default: "true"
        type: boolean
      accuracy_threshold:
        description: "Umbral mínimo de Accuracy para promover modelo (0-1)"
        required: false
        default: "0.88"
        type: string

env:
  PYTHON_VERSION: "3.10"
  MLFLOW_TRACKING_URI: "http://localhost:5000"
  IMAGE_NAME: omer022/mlops-news-classifier

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Ingesta de Nuevos Datos y Chequeo de Drift
  # ───────────────────────────────────────────────────────────────────────────
  check-and-ingest:
    name: 📥 Ingesta de Datos y Chequeo de Calidad
    runs-on: ubuntu-latest
    outputs:
      should_train: ${{ steps.decide.outputs.should_train }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias base
        run: |
          pip install --upgrade pip
          pip install pandas numpy pyyaml evidently datasets

      - name: Ingesta de datos y verificación de integridad
        run: |
          python src/ingest.py
          python src/preprocess.py

      - name: Evaluar Data Drift con Evidently AI
        id: drift_check
        run: |
          python monitoring/monitor.py || echo "DRIFT_DETECTED=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Decidir si se requiere reentrenamiento
        id: decide
        run: |
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ] || [ "${{ env.DRIFT_DETECTED }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_train=true" >> $GITHUB_OUTPUT
            echo "🚀 Reentrenamiento requerido y autorizado."
          else
            echo "should_train=false" >> $GITHUB_OUTPUT
            echo "✅ Datos estables, no se requiere reentrenamiento forzado."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Reentrenamiento, Seguimiento en MLflow y Evaluación de Umbral
  # ───────────────────────────────────────────────────────────────────────────
  retrain-and-evaluate:
    name: 🏋️ Reentrenamiento y Evaluación de Modelos
    needs: check-and-ingest
    if: needs.check-and-ingest.outputs.should_train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias de entrenamiento
        run: |
          pip install --upgrade pip
          pip install scikit-learn numpy pandas mlflow joblib pyyaml matplotlib seaborn

      - name: Iniciar servidor local de MLflow
        run: |
          mkdir -p mlruns
          mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlruns/mlflow.db \
            --default-artifact-root ./mlruns/artifacts &
          sleep 5

      - name: Ejecutar experimentos y entrenamiento
        run: |
          python src/train.py
        env:
          MLFLOW_TRACKING_URI: "http://localhost:5000"

      - name: Evaluar modelo contra conjunto de Test
        id: eval_step
        run: |
          python src/evaluate.py
          ACCURACY=$(python -c "
          import json
          m = json.load(open('reports/final_metrics.json'))
          print(m.get('accuracy', 0))
          ")
          echo "accuracy=${ACCURACY}" >> $GITHUB_OUTPUT
          echo "Nueva Accuracy obtenida: ${ACCURACY}"
        env:
          MLFLOW_TRACKING_URI: "http://localhost:5000"

      - name: Validar umbral de calidad (Quality Gate)
        run: |
          python - <<EOF
          threshold = float("${{ github.event.inputs.accuracy_threshold || '0.88' }}")
          accuracy  = float("${{ steps.eval_step.outputs.accuracy }}")
          print(f"Resultado obtenido: {accuracy:.4f} | Umbral requerido: {threshold:.4f}")
          if accuracy < threshold:
              print("❌ ERROR: El nuevo modelo no supera el umbral de calidad para producción.")
              exit(1)
          print("✅ ÉXITO: El modelo supera el umbral y está listo para producción.")
          EOF

      - name: Cargar artefactos de entrenamiento
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model-artifacts
          path: |
            reports/
            models/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Redespliegue y Publicación de Contenedor
  # ───────────────────────────────────────────────────────────────────────────
  redeploy:
    name: 🚀 Redespliegue Automático de la Aplicación
    needs: retrain-and-evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar nuevo modelo entrenado
        uses: actions/download-artifact@v4
        with:
          name: retrained-model-artifacts

      - name: Notificar Redespliegue Exitoso
        run: |
          echo "## 🚀 Mantenimiento Semanal Completado" >> $GITHUB_STEP_SUMMARY
          echo "El modelo ha sido reentrenado con éxito, verificado contra los umbrales de calidad y registrado para despliegue." >> $GITHUB_STEP_SUMMARY
          echo "- **Fecha de ejecución:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado:** Exitoso y promovido a Producción" >> $GITHUB_STEP_SUMMARY
