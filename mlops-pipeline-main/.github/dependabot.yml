# ─────────────────────────────────────────────────────────────────────────────
# Dependabot Configuration
# Automatización de parches y actualización de dependencias
# ─────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  # 1. Dependencias de Python (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "devops-team"
    labels:
      - "dependencies"
      - "python"
      - "maintenance"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # 2. Acciones de GitHub (Workflows en .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"

  # 3. Imágenes base de Docker (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "security"
    commit-message:
      prefix: "build(docker)"
